cases:
- id: cap-tradeoff
  question: During a network partition, what does the CAP theorem force you to choose between?
  relevant_snippets:
  - between consistency and availability
  reference_answer: During a partition you must choose between consistency and availability;
    you cannot have both.
  evidence_ids:
  - cap-theorem:words:41-45
  split: smoke
  tags:
  - cap-theorem
  language: en
  answerable: true
  group_id: cap-theorem:words:41-45
- id: cap-cp
  question: What does a CP system give up during a partition?
  relevant_snippets:
  - A CP system favors consistency
  reference_answer: A CP system favors consistency and gives up availability, rejecting requests
    rather than returning stale data.
  evidence_ids:
  - cap-theorem:words:99-104
  split: smoke
  tags:
  - cap-theorem
  language: en
  answerable: true
  group_id: cap-theorem:words:99-104
- id: cap-ap
  question: How does an AP system behave during a partition?
  relevant_snippets:
  - An AP system favors availability
  reference_answer: An AP system favors availability, keeps serving both sides of the partition,
    and reconciles divergence afterward.
  evidence_ids:
  - cap-theorem:words:133-138
  split: smoke
  tags:
  - cap-theorem
  language: en
  answerable: true
  group_id: cap-theorem:words:133-138
- id: cons-eventual
  question: What does eventual consistency guarantee?
  relevant_snippets:
  - Eventual consistency only guarantees
  reference_answer: Eventual consistency guarantees only that, with no new writes, all replicas
    eventually converge to the same value.
  evidence_ids:
  - consistency-models:words:96-100
  split: smoke
  tags:
  - consistency-models
  language: en
  answerable: true
  group_id: consistency-models:words:96-100
- id: cons-causal
  question: What is causal consistency?
  relevant_snippets:
  - Causal consistency sits between the two
  reference_answer: Causal consistency ensures causally related operations are seen in the
    same order by all processes, while concurrent operations may be seen in different orders.
  evidence_ids:
  - consistency-models:words:141-147
  split: smoke
  tags:
  - consistency-models
  language: en
  answerable: true
  group_id: consistency-models:words:141-147
- id: cons-ryw
  question: What does read-your-writes consistency ensure?
  relevant_snippets:
  - Read-your-writes consistency
  reference_answer: Read-your-writes consistency ensures a client always sees the effects
    of its own prior writes.
  evidence_ids:
  - consistency-models:words:197-199
  split: smoke
  tags:
  - consistency-models
  language: en
  answerable: true
  group_id: consistency-models:words:197-199
